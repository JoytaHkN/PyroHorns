name: PWA (visor online)

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'fastlane/**', '.github/dependabot.yml', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Exportar la web
        run: npx expo export --platform web
        env:
          EXPO_BASE_URL: /PyroHorns
      # GitHub Pages no conoce las rutas de la app: 404.html redirige a la misma app.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
