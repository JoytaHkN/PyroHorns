name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # P31-M4: la app muestra qué compilación es y versionCode crece con cada commit.
      - name: Datos de la compilación
        run: |
          echo "PYROHORNS_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "PYROHORNS_BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "PYROHORNS_BUILD_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm test
      - name: Generar el proyecto Android
        run: npx expo prebuild --platform android --no-install
      - name: Compilar APK (arm64-v8a)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Comprobar el contenido del APK
        run: python3 -I scripts/check-apk.py android/app/build/outputs/apk/release/app-release.apk --sha "$GITHUB_SHA"
      # S16-A: la clave de firma vive en los secretos de GitHub y solo existe durante este paso.
      - name: Firmar APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Falta el secreto ANDROID_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release.apk
          OUT="PyroHorns-${GITHUB_REF_NAME}-arm64-v8a.apk"
          "$BT/zipalign" -f -p 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: softprops/action-gh-release@v2
        with:
          name: PyroHorns ${{ github.ref_name }}
          # Las etiquetas con guion (v0.1.0-alpha.1, -beta…) se publican como versión de prueba.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            PyroHorns-*.apk
            PyroHorns-*.apk.sha256
