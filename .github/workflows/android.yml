name: Android

on:
  push:
    branches: [main]
    # Los cambios solo de documentación (estado, plan, metadatos) no recompilan el APK.
    paths-ignore: ['**.md', 'docs/**', 'fastlane/**', '.github/dependabot.yml', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Instalar NDK y CMake para el motor llama.cpp
        run: sdkmanager "ndk;27.1.12297006" "cmake;3.31.6"
      - run: npm ci --no-audit --no-fund
      - name: Generar el proyecto Android
        run: npx expo prebuild --platform android --no-install
      - name: Compilar APK (arm64-v8a)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pyrohorns-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
