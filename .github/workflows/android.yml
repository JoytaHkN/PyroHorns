name: Android

on:
  push:
    branches: [main]
    # Los cambios solo de documentación (estado, plan, metadatos) no recompilan el APK.
    paths-ignore: ['**.md', 'docs/**', 'fastlane/**', 'scripts/eval-*', 'scripts/fetch-apk.sh', '.github/dependabot.yml', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # P31-M4: la app muestra qué compilación es y versionCode crece con cada commit.
      - name: Datos de la compilación
        run: |
          echo "PYROHORNS_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "PYROHORNS_BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "PYROHORNS_BUILD_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Instalar NDK y CMake para el motor llama.cpp
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.1.12297006" "cmake;3.31.6"
      # P31-M5: ccache reutiliza la compilación de C++ (llama.cpp y whisper.cpp) entre ejecuciones.
      - name: Instalar ccache
        run: |
          command -v ccache || { sudo apt-get update -qq && sudo apt-get install -y -qq ccache; }
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          # El NDK se reinstala en cada ejecución: identificar el compilador por su fecha (por defecto) nunca acertaba.
          echo "CCACHE_COMPILERCHECK=%compiler% --version" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-android-${{ github.run_id }}
          restore-keys: ccache-android-
      - run: npm ci --no-audit --no-fund
      - name: Generar el proyecto Android
        run: npx expo prebuild --platform android --no-install
      - run: ccache --zero-stats
      - name: Compilar APK (arm64-v8a)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      # P31-M8: misma firma que las versiones de prueba, no la clave de depuración pública de la plantilla.
      - name: Firmar APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          sh scripts/sign-apk.sh "$APK" "$RUNNER_TEMP/signed.apk"
          mv "$RUNNER_TEMP/signed.apk" "$APK"
      - name: Comprobar el contenido del APK
        run: python3 -I scripts/check-apk.py android/app/build/outputs/apk/release/app-release.apk --sha "$GITHUB_SHA"
      - name: Uso de ccache
        run: ccache -s
      - uses: actions/upload-artifact@v7
        with:
          name: pyrohorns-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
