plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'io.github.joytahkn.pyrohorns'
version = '0.1.0'

repositories {
  mavenCentral()
}

def reactNativeArchitectures() {
  def value = project.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["arm64-v8a"]
}

android {
  namespace "expo.modules.pyrohornsllama"

  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles "consumer-rules.pro"

    externalNativeBuild {
      cmake {
        abiFilters (*reactNativeArchitectures())
        arguments "-DCMAKE_BUILD_TYPE=Release",
          "-DANDROID_STL=c++_shared",
          "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
          "-DLLAMA_CURL=OFF",
          "-DLLAMA_OPENSSL=OFF",
          "-DLLAMA_BUILD_COMMON=OFF",
          "-DLLAMA_BUILD_TESTS=OFF",
          "-DLLAMA_BUILD_TOOLS=OFF",
          "-DLLAMA_BUILD_EXAMPLES=OFF",
          "-DLLAMA_BUILD_SERVER=OFF",
          "-DGGML_LLAMAFILE=OFF",
          "-DGGML_NATIVE=OFF",
          // Variantes de ggml-cpu (NEON, dotprod, fp16, i8mm, SVE…) como bibliotecas separadas; el motor elige la mejor para
          // la CPU en ejecución (como LM Playground). Sustituye a la bandera fija armv8.2-a+dotprod+fp16 y evita el SIGILL en CPUs sin esas instrucciones.
          // Si se cambia, actualizar ENGINE_BUILD en src/lib/bench.ts.
          "-DGGML_BACKEND_DL=ON",
          "-DGGML_CPU_ALL_VARIANTS=ON",
          "-DGGML_VULKAN=OFF",
          "-DGGML_OPENMP=OFF",
          "-DBUILD_SHARED_LIBS=ON"
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.31.6"
    }
  }
}
